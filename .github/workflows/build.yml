name: Build

on:
  push:
    tags:
      - v*

env:
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RP2_PATH: runtime/micropython/ports/rp2
      UF2_FILE: firmware-${{ github.ref_name }}.uf2
      BOARD: RPI_PICO_W

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize submodules
        run: git submodule update --init runtime/micropython

      - name: Install linux dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Embed html
        run: |
          gzip --best web/index.html
          python scripts/embed_files.py web/index.html.gz > magic_lights/_files.py

      - name: Build
        run: |
          make -C "$RP2_PATH" submodules BOARD="$BOARD"
          make -C "$RP2_PATH" FROZEN_MANIFEST="$GITHUB_WORKSPACE/manifest.py" BOARD="$BOARD"
          cp "$RP2_PATH/build-$BOARD/firmware.uf2" "$UF2_FILE"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.UF2_FILE }}
          body: Firmware for the Raspberry Pi Pico Magic Lights board
